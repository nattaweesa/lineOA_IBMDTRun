<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IBMDT Run Admin Login</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap");

    :root {
      --card: #ffffff;
      --text: #12271e;
      --muted: #607168;
      --line: #d7e3dc;
      --accent: #0d7a59;
      --accent-2: #16a379;
      --danger: #bf3450;
      --ring: rgba(22, 163, 121, .22);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans Thai", "Thonburi", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 15%, rgba(191, 243, 224, .95), rgba(191, 243, 224, 0) 28%),
        radial-gradient(circle at 92% 10%, rgba(255, 226, 203, .95), rgba(255, 226, 203, 0) 26%),
        linear-gradient(145deg, #eef9f4 0%, #f5f8fb 52%, #fff8f0 100%);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .panel {
      width: min(100%, 480px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 26px 24px 24px;
      box-shadow: 0 18px 44px rgba(18, 44, 34, .12);
      position: relative;
      overflow: hidden;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-2), #ff8b42);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand-mark {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: 0 12px 24px rgba(13, 122, 89, .24);
    }

    .brand-copy small {
      display: block;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 34px;
      line-height: 1.1;
      color: #164736;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-weight: 500;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 700;
      color: #27483c;
    }

    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 13px;
      font: inherit;
      background: #fbfefd;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px var(--ring);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(120deg, var(--accent-2), var(--accent));
      color: #ffffff;
      box-shadow: 0 9px 18px rgba(13, 122, 89, .22);
    }

    .ghost {
      border-color: var(--line);
      background: #f4f8f6;
      color: #264639;
    }

    .note {
      border: 1px solid #dce8e1;
      background: #f7fbf9;
      border-radius: 16px;
      padding: 13px;
      color: #36564a;
      font-size: 15px;
      line-height: 1.55;
      margin-top: 18px;
    }

    .status {
      min-height: 24px;
      font-weight: 700;
      font-size: 15px;
      margin-top: 12px;
    }

    .ok { color: #15834c; }
    .err { color: var(--danger); }

    @media (max-width: 520px) {
      .panel {
        border-radius: 18px;
        padding: 22px 18px 18px;
      }

      h1 { font-size: 29px; }
      .actions { display: grid; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand">
      <div class="brand-mark">IR</div>
      <div class="brand-copy">
        <small>IBMDT Run</small>
        <h1>Admin Login</h1>
      </div>
    </div>
    <p class="lead">เข้าสู่ระบบด้วยบัญชีแอดมินที่ได้รับสิทธิ์</p>

    <form id="loginForm">
      <label>
        Username
        <input id="username" name="username" autocomplete="username" required />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <div class="actions">
        <button class="primary" type="submit">เข้าสู่ระบบ</button>
        <button id="backBtn" class="ghost" type="button">กลับหน้าหลัก LINE</button>
      </div>
    </form>

    <div class="note">ระบบใช้รหัสผ่านแบบ hash ในฝั่ง server และเก็บ session ด้วย HttpOnly cookie ที่ JavaScript อ่านตรงๆ ไม่ได้</div>
    <div id="status" class="status"></div>
  </main>

  <script>
    const qs = new URLSearchParams(window.location.search);
    const formEl = document.getElementById("loginForm");
    const usernameEl = document.getElementById("username");
    const passwordEl = document.getElementById("password");
    const statusEl = document.getElementById("status");

    function getSafeNextPath() {
      const next = String(qs.get("next") || "/admin").trim();
      if (!next.startsWith("/admin") || next.startsWith("//")) {
        return "/admin";
      }
      return next;
    }

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = "status " + (type || "");
    }

    function renderReasonStatus() {
      const reason = qs.get("reason");
      if (reason === "idle") {
        setStatus("ระบบ logout ให้แล้ว เพราะไม่มีการใช้งานเกิน 10 นาที", "err");
      } else if (reason === "expired") {
        setStatus("Session หมดอายุ กรุณาเข้าสู่ระบบใหม่", "err");
      }
    }

    async function loadCurrentAdmin() {
      const res = await fetch("/api/auth/me", { credentials: "include" });
      if (res.status === 401) {
        return null;
      }
      const data = await res.json();
      if (!res.ok || !data.ok) {
        throw new Error(data.error || "ตรวจสอบผู้ใช้ปัจจุบันไม่สำเร็จ");
      }
      return data.admin || null;
    }

    async function checkLoginReady() {
      const res = await fetch("/api/auth/config", { credentials: "include" });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        throw new Error(data.error || "โหลด config auth ไม่สำเร็จ");
      }
      if (!data.passwordLoginEnabled) {
        setStatus("ยังไม่ได้ตั้งค่า ADMIN_USERNAME / ADMIN_PASSWORD_HASH กรุณาติดต่อผู้ดูแลระบบ", "err");
        formEl.querySelector("button[type='submit']").disabled = true;
      }
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("กำลังเข้าสู่ระบบ...", "");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "include",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: usernameEl.value.trim(),
            password: passwordEl.value,
          }),
        });

        const data = await res.json();
        if (!res.ok || !data.ok) {
          throw new Error(data.error || "Login ไม่สำเร็จ");
        }

        setStatus("เข้าสู่ระบบสำเร็จ กำลังพาไปหน้าแอดมิน...", "ok");
        window.location.replace(getSafeNextPath());
      } catch (err) {
        setStatus(err.message || "เกิดข้อผิดพลาดตอน login", "err");
      }
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      if (document.referrer) {
        window.location.href = document.referrer;
        return;
      }
      window.location.href = "https://line.me/";
    });

    loadCurrentAdmin()
      .then((admin) => {
        if (admin) {
          window.location.replace(getSafeNextPath());
          return;
        }
        renderReasonStatus();
        return checkLoginReady();
      })
      .catch((err) => setStatus(err.message || "เกิดข้อผิดพลาด", "err"));
  </script>
</body>
</html>
