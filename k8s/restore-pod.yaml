apiVersion: v1
kind: Pod
metadata:
  name: lineoa-ibmdtrun-restore
  namespace: __NAMESPACE__
  labels:
    app: lineoa-ibmdtrun
    job: restore-helper
spec:
  restartPolicy: Never
  containers:
    - name: restore
      image: busybox:1.36
      command:
        - sh
        - -c
        - mkdir -p /data /public/generated /public/uploads && sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
        - name: public
          mountPath: /public
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lineoa-ibmdtrun-data
    - name: public
      persistentVolumeClaim:
        claimName: lineoa-ibmdtrun-public
