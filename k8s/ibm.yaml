apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lineoa-ibmdtrun-data
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lineoa-ibmdtrun-public
  namespace: __NAMESPACE__
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lineoa-ibmdtrun-config
  namespace: __NAMESPACE__
data:
  PORT: "3010"
  BASE_URL: "__BASE_URL__"
  DATABASE_URL: "file:../data/dev.db"
  ADMIN_ALLOW_API_KEY_FALLBACK: "false"
  ADMIN_SESSION_TTL_HOURS: "12"
  ADMIN_SESSION_IDLE_MINUTES: "10"
  ADMIN_ALLOWED_DOMAINS: "msoftthai.com"
  BACKUP_DIR: "data/backups"
  MAINTENANCE_CONFIRM_TEXT: "CLEAR_USER_DATA"
  ADMIN_EXPORT_DB_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lineoa-ibmdtrun
  namespace: __NAMESPACE__
  labels:
    app: lineoa-ibmdtrun
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: 1
  selector:
    matchLabels:
      app: lineoa-ibmdtrun
  template:
    metadata:
      labels:
        app: lineoa-ibmdtrun
    spec:
      imagePullSecrets:
        - name: all-icr-io
      initContainers:
        - name: init-public-dirs
          image: busybox:1.36
          command:
            - sh
            - -c
            - mkdir -p /public/generated /public/uploads /data
          volumeMounts:
            - name: public
              mountPath: /public
            - name: data
              mountPath: /data
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - npx prisma db push && node dist/index.js
          ports:
            - name: http
              containerPort: 3010
          envFrom:
            - configMapRef:
                name: lineoa-ibmdtrun-config
            - secretRef:
                name: lineoa-ibmdtrun-secrets
          readinessProbe:
            httpGet:
              path: /health/db
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: public
              mountPath: /app/public/generated
              subPath: generated
            - name: public
              mountPath: /app/public/uploads
              subPath: uploads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lineoa-ibmdtrun-data
        - name: public
          persistentVolumeClaim:
            claimName: lineoa-ibmdtrun-public
---
apiVersion: v1
kind: Service
metadata:
  name: lineoa-ibmdtrun
  namespace: __NAMESPACE__
  labels:
    app: lineoa-ibmdtrun
spec:
  selector:
    app: lineoa-ibmdtrun
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lineoa-ibmdtrun
  namespace: __NAMESPACE__
spec:
  tls:
    - hosts:
        - __HOST__
      secretName: mycluster-jp-tok-1-bx2-4x-a8fd6d2a2463aad636c736bb6b7a13a1-0000
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lineoa-ibmdtrun
                port:
                  number: 80
